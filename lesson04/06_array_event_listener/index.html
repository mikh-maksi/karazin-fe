<script>
        let min = 10;
        let max = 20-min;

        // console.log(t_day);
        let temperature = [];

        for(i=0;i<30;i+=1){
            let t_day = Math.floor(Math.random() * max)+min;
            temperature.push(t_day);
        }

        console.log(temperature);
        console.log(t_day);
       
        let sum = 0;
        let q = 0;

        for(i=0;i<temperature.length;i+=1){
            if (i % 2 == 1){
                console.log(i+1);
                sum+=temperature[i];
                q+=1;
            }

        }
        avg_temperature = sum/q;
        console.log(avg_temperature);
</script>
